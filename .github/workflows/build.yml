name: Export KODA Modules

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Copy All Repository Files
      run: |
        mkdir -p exported
        # Копируем вообще все файлы из текущей директории, исключая скрытые системные папки вроде .git
        rsync -av --exclude='.git' --exclude='exported' ./ exported/
        ls -la exported/

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KODA_Source_Files
        path: exported/
