name: Build Instagram Mod IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Package KODA Modules via Python
      run: |
        mkdir -p output_mod
        python3 -c "
        import zipfile, glob
        with zipfile.ZipFile('output_mod/KODA_Modules.zip', 'w') as zf:
            for f in glob.glob('*.m'):
                zf.write(f)
                print(f'Added: {f}')
        "
        ls -lh output_mod/

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KODA_Modules_Archive
        path: output_mod/KODA_Modules.zip
