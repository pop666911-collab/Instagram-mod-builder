name: Build KODA dylib

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Compile to dylib
      run: |
        mkdir -p build_output
        echo "Compiling modules with entry point..."
        
        clang -dynamiclib \
          -target arm64-apple-ios14.0 \
          -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
          -fobjc-arc \
          -framework Foundation \
          -framework UIKit \
          Tweak.m DeviceSpoofer.m CookieLoginManager.m AutoUploadManager.m \
          -o build_output/KODA.dylib
          
        echo "Build finished!"
        ls -lh build_output/

    - name: Upload dylib Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KODA_dylib
        path: build_output/KODA.dylib
