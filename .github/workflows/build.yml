name: Export KODA Modules

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Archive Raw Source Files
      run: |
        mkdir -p release
        zip -r release/KODA_Source_Code.zip *.m

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KODA_Source_Archive
        path: release/KODA_Source_Code.zip
