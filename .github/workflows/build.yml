name: Build Instagram Mod IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Upload Raw Source Files
      uses: actions/upload-artifact@v4
      with:
        name: KODA_Source_Files
        path: |
          DeviceSpoofer.m
          CookieLoginManager.m
          AutoUploadManager.m
