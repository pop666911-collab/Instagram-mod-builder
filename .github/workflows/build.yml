name: Export KODA Modules

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Upload Exact Source Files
      uses: actions/upload-artifact@v4
      with:
        name: KODA_Source_Files
        path: |
          DeviceSpoofer.m
          CookieLoginManager.m
          AutoUploadManager.m
        if-no-files-found: ignore
