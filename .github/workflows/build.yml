name: Build Instagram Mod IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Download Clean Instagram IPA
      run: |
        mkdir -p output_mod
        echo "Downloading valid Instagram IPA..."
        curl -L -o output_mod/Instagram_KODA_Mod.ipa "https://github.com/qnblackcat/How-to-Downgrade-apps-on-AppStore-with-iTunes-and-Charles/raw/master/instagram.ipa"

    - name: Check file size
      run: |
        ls -lh output_mod/Instagram_KODA_Mod.ipa

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Instagram_KODA_Mod
        path: output_mod/*.ipa
