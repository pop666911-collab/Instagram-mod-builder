name: Build Instagram Mod IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Package KODA Modules
      run: |
        # Создаем папку для артефакта внутри рабочей директории
        mkdir -p build_output
        
        # Запускаем Python для точной упаковки
        python3 -c "
        import zipfile, os
        
        # Проверяем текущую папку и файлы
        print('Current directory contents:', os.listdir('.'))
        
        target_files = ['DeviceSpoofer.m', 'CookieLoginManager.m', 'AutoUploadManager.m']
        archive_path = 'build_output/KODA_Modules.zip'
        
        with zipfile.ZipFile(archive_path, 'w', zipfile.ZIP_DEFLATED) as zf:
            for file in target_files:
                if os.path.exists(file):
                    zf.write(file)
                    print(f'SUCCESS: Added {file} to archive.')
                else:
                    print(f'ERROR: File {file} not found!')
        
        print('Archive size:', os.path.getsize(archive_path), 'bytes')
        "

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KODA_Modules_Archive
        path: build_output/KODA_Modules.zip
