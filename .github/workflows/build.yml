name: Build KODA dylib

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Show SDKs and Compile with Verbose Output
      run: |
        echo "=== AVAILABLE SDKS ==="
        xcodebuild -showsdks
        
        mkdir -p build_output
        
        echo "=== STARTING COMPILATION ==="
        # Запускаем clang с выводом всех ошибок (перенаправляем stderr в stdout)
        clang -dynamiclib \
          -target arm64-apple-ios14.0 \
          -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
          -fobjc-arc \
          -framework Foundation \
          -framework UIKit \
          Tweak.m DeviceSpoofer.m CookieLoginManager.m AutoUploadManager.m \
          -o build_output/KODA.dylib 2>&1 || true

        echo "=== CHECKING OUTPUT ==="
        ls -lh build_output/
