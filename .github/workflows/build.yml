name: Build KODA dylib

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Compile to dylib
      run: |
        mkdir -p build_output
        echo "Starting clean compilation..."
        
        # Компилируем напрямую под iOS SDK без вызова xcrun, который падает на раннере
        SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path 2>/dev/null || echo "")
        
        if [ -z "$SDK_PATH" ]; then
          # Запасной вариант пути для SDK на макос-раннере
          SDK_PATH="/Applications/Xcode.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk"
        fi
        
        echo "Using SDK: $SDK_PATH"
        
        clang -dynamiclib \
          -target arm64-apple-ios14.0 \
          -isysroot "$SDK_PATH" \
          -fobjc-arc \
          -framework Foundation \
          -framework UIKit \
          Tweak.m DeviceSpoofer.m CookieLoginManager.m AutoUploadManager.m \
          -o build_output/KODA.dylib
          
        echo "Build finished successfully!"
        ls -lh build_output/

    - name: Upload dylib Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KODA_dylib
        path: build_output/KODA.dylib
