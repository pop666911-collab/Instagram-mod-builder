name: Build KODA dylib

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Direct Compile without SDK check
      run: |
        mkdir -p build_output
        echo "Compiling directly..."
        
        # Прямая компиляция под iOS arm64 без капризных путей SDK
        clang -dynamiclib \
          -target arm64-apple-ios14.0 \
          -fobjc-arc \
          -framework Foundation \
          -framework UIKit \
          Tweak.m DeviceSpoofer.m CookieLoginManager.m AutoUploadManager.m \
          -o build_output/KODA.dylib
          
        echo "Compilation done!"
        ls -lh build_output/

    - name: Upload dylib Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KODA_dylib
        path: build_output/KODA.dylib
