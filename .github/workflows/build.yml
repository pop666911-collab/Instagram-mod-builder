name: Build Instagram Mod IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Create and Package Modules
      run: |
        mkdir -p output_mod
        echo "Creating archive with modules..."
        
        # Упаковываем все файлы с расширением .m, которые есть в репозитории
        zip output_mod/KODA_Modules.zip *.m || echo "No .m files found at root"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Instagram_KODA_Mod
        path: output_mod/*.zip
