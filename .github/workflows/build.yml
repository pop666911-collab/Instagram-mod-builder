name: Build Instagram Mod IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Download Clean Instagram IPA
      run: |
        mkdir -p output_mod
        echo "Downloading Instagram IPA..."
        # Используем альтернативную прямую ссылку на стабильный архив
        curl -L -o output_mod/Instagram_KODA_Mod.ipa "https://raw.githubusercontent.com/Fxi/IPA/main/Instagram.ipa" || \
        curl -L -o output_mod/Instagram_KODA_Mod.ipa "https://github.com/arror/ipatool-py/releases/download/v1.0.0/Instagram.ipa"

    - name: Check file size
      run: |
        ls -lh output_mod/Instagram_KODA_Mod.ipa
        FILESIZE=$(stat -f%z output_mod/Instagram_KODA_Mod.ipa)
        if [ "$FILESIZE" -lt 10000000 ]; then
          echo "Error: File size is too small ($FILESIZE bytes). Trying fallback link..."
          curl -L -o output_mod/Instagram_KODA_Mod.ipa "https://raw.githubusercontent.com/qnblackcat/How-to-Downgrade-apps-on-AppStore-with-iTunes-and-Charles/raw/master/instagram.ipa"
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Instagram_KODA_Mod
        path: output_mod/*.ipa
