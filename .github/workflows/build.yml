name: Build Instagram Mod IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Package Source Modules
      run: |
        mkdir -p output_mod
        echo "Packaging KODA modules for ESign..."
        # Архивируем наши .m файлы в удобный пакет для внедрения
        zip -r output_mod/KODA_Modules.zip DeviceSpoofer.m CookieLoginManager.m AutoUploadManager.m

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Instagram_KODA_Mod
        path: output_mod/*.zip
