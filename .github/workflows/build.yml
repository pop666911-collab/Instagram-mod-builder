name: Build Instagram Mod IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Package KODA Modules via Python
      run: |
        mkdir -p output_mod
        python3 -c "
        import zipfile, os
        # Переходим в рабочую директорию репозитория
        os.chdir('${{ github.workspace }}')
        print('Current dir:', os.getcwd())
        print('Files found:', os.listdir('.'))
        
        with zipfile.ZipFile('output_mod/KODA_Modules.zip', 'w') as zf:
            for file in ['DeviceSpoofer.m', 'CookieLoginManager.m', 'AutoUploadManager.m']:
                if os.path.exists(file):
                    zf.write(file)
                    print(f'Added to archive: {file}')
                else:
                    print(f'Warning: {file} not found!')
        "
        ls -lh output_mod/

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KODA_Modules_Archive
        path: output_mod/KODA_Modules.zip
