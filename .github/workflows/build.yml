name: Build Instagram Mod IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Download Clean Instagram IPA
      run: |
        mkdir -p output_mod
        echo "Downloading Instagram IPA..."
        # Используем прямую стабильную ссылку на рабочий IPA
        curl -L -o output_mod/Instagram_KODA_Mod.ipa "https://github.com/qnblackcat/How-to-Downgrade-apps-on-AppStore-with-iTunes-and-Charles/raw/master/instagram.ipa"
        
        # Проверяем реальный размер файла, если он меньше 10 МБ — ошибка скачивания
        FILESIZE=$(stat -f%z output_mod/Instagram_KODA_Mod.ipa)
        echo "Downloaded file size: $FILESIZE bytes"
        if [ "$FILESIZE" -lt 10000000 ]; then
          echo "Error: Downloaded file is too small!"
          exit 1
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Instagram_KODA_Mod
        path: output_mod/*.ipa
